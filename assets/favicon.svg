<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="nvFavBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="nvFavGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#nvFavBg)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" />
  
  <!-- Outer accent ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#nvFavGlow)" stroke-width="2.5" opacity="0.4" stroke-dasharray="4 2" />
  
  <!-- Calculator Screen and Keypad emblem with Q slash -->
  <rect x="18" y="15" width="28" height="10" rx="3" fill="#0c1836" stroke="#00f2fe" stroke-width="1.2" />
  <line x1="22" y1="20" x2="32" y2="20" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Keys Grid -->
  <circle cx="22" cy="32" r="2.5" fill="#8b5cf6" />
  <circle cx="32" cy="32" r="2.5" fill="#00f2fe" />
  <circle cx="42" cy="32" r="2.5" fill="#8b5cf6" />

  <circle cx="22" cy="40" r="2.5" fill="#06b6d4" />
  <circle cx="32" cy="40" r="2.5" fill="#8b5cf6" />
  <circle cx="42" cy="40" r="2.5" fill="#00f2fe" />

  <!-- Dynamic lightning / Q tail stroke -->
  <path d="M36 38 L48 50" stroke="url(#nvFavGlow)" stroke-width="3" stroke-linecap="round" filter="url(#favGlow)" />
</svg>
